name: Build NANDO BROS II Android APK

on:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

concurrency:
  group: nando-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli@1.24.1
          BUBBLEWRAP_SDK="$RUNNER_TEMP/bubblewrap-sdk"
          mkdir -p "$HOME/.bubblewrap" "$BUBBLEWRAP_SDK"
          cp -R "$ANDROID_SDK_ROOT/cmdline-tools/latest/." "$BUBBLEWRAP_SDK/"
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -R "$ANDROID_SDK_ROOT/licenses" "$BUBBLEWRAP_SDK/licenses"; fi
          yes | "$BUBBLEWRAP_SDK/bin/sdkmanager" --sdk_root="$BUBBLEWRAP_SDK" "platforms;android-36" "build-tools;36.1.0"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BUBBLEWRAP_SDK" > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Prepare signing password
        run: |
          KEY_PASS="$(openssl rand -hex 18)"
          echo "::add-mask::$KEY_PASS"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Generate Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEY_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          mkdir -p android
          cat > android/twa-manifest.json <<'JSON'
          {
            "packageId": "io.github.rumuva.nandobros2",
            "host": "rumuva.github.io",
            "name": "NANDO BROS II",
            "launcherName": "NANDO II",
            "display": "fullscreen",
            "themeColor": "#178fe5",
            "themeColorDark": "#0b1744",
            "navigationColor": "#178fe5",
            "navigationColorDark": "#0b1744",
            "navigationDividerColor": "#178fe5",
            "navigationDividerColorDark": "#0b1744",
            "backgroundColor": "#0b1744",
            "enableNotifications": false,
            "enableSiteSettingsShortcut": true,
            "startUrl": "/index.html",
            "iconUrl": "https://rumuva.github.io/icons/icon-512.png",
            "maskableIconUrl": "https://rumuva.github.io/icons/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "nando-bros-key"
            },
            "appVersionCode": 1,
            "appVersion": "1.0.0",
            "shortcuts": [],
            "generatorApp": "PWABuilder",
            "webManifestUrl": "https://rumuva.github.io/manifest.webmanifest",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {"enabled": false},
              "playBilling": {"enabled": false}
            },
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://rumuva.github.io/",
            "minSdkVersion": 23,
            "orientation": "landscape",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          JSON
          bubblewrap update --skipVersionUpgrade --manifest=android/twa-manifest.json --directory=android
          keytool -genkeypair -noprompt \
            -keystore android/android.keystore \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -alias nando-bros-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=NANDO BROS II Admin, OU=Games, O=NANDO BROS, C=ES"

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEY_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          bubblewrap build --skipPwaValidation
          test -f app-release-signed.apk
          cp app-release-signed.apk NANDO-BROS-II.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NANDO-BROS-II-APK
          path: android/NANDO-BROS-II.apk
          if-no-files-found: error
          retention-days: 30
