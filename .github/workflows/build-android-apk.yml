name: Build NANDO BROS II Android APK

on:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bubblewrap
        run: |
          npm install --global @bubblewrap/cli@1.24.1
          BUBBLEWRAP_SDK="$RUNNER_TEMP/bubblewrap-sdk"
          mkdir -p "$HOME/.bubblewrap" "$BUBBLEWRAP_SDK"
          ln -s "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" "$BUBBLEWRAP_SDK/bin"
          if [ -d "$ANDROID_SDK_ROOT/licenses" ]; then cp -R "$ANDROID_SDK_ROOT/licenses" "$BUBBLEWRAP_SDK/licenses"; fi
          yes | "$BUBBLEWRAP_SDK/bin/sdkmanager" --sdk_root="$BUBBLEWRAP_SDK" "platforms;android-36" "build-tools;36.1.0"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$BUBBLEWRAP_SDK" > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Prepare signing password
        run: |
          KEY_PASS="$(openssl rand -hex 18)"
          echo "::add-mask::$KEY_PASS"
          echo "KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Generate Android project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEY_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y expect
          mkdir -p android
          cat > /tmp/init-bubblewrap.exp <<'EXPECT'
          set timeout 600
          log_user 1
          spawn bubblewrap init --manifest=https://rumuva.github.io/manifest.webmanifest --directory=android
          expect -re {Domain:} { send "rumuva.github.io\r" }
          expect -re {URL path:} { send "/index.html\r" }
          expect -re {Application name:} { send "NANDO BROS II\r" }
          expect -re {Short name:} { send "NANDO II\r" }
          expect -re {Application ID:} { send "io.github.rumuva.nandobros2\r" }
          expect -re {Starting version code} { send "1\r" }
          expect -re {Display mode:} { send "\r" }
          expect -re {Orientation:} { send "\r" }
          expect -re {Status bar color:} { send "#178fe5\r" }
          expect -re {Splash screen color:} { send "#0b1744\r" }
          expect -re {Icon URL:} { send "https://rumuva.github.io/icons/icon-512.png\r" }
          expect -re {Maskable icon URL:} { send "https://rumuva.github.io/icons/icon-512.png\r" }
          expect -re {Monochrome icon URL:} { send "\r" }
          expect -re {Include support for Play Billing} { send "n\r" }
          expect -re {Request geolocation permission} { send "n\r" }
          expect -re {Key store location:} { send "\r" }
          expect -re {Key name:} { send "nando-bros-key\r" }
          expect -re {Do you want to create one now} { send "y\r" }
          expect -re {First and Last names} { send "NANDO BROS II Admin\r" }
          expect -re {Organizational Unit} { send "Games\r" }
          expect -re {Organization \(eg: Company Name\)} { send "NANDO BROS\r" }
          expect -re {Country \(2 letter code\)} { send "ES\r" }
          expect -re {Password for the Key Store:} { send "$env(KEY_PASS)\r" }
          expect -re {Password for the Key:} { send "$env(KEY_PASS)\r" }
          expect eof
          catch wait result
          exit [lindex $result 3]
          EXPECT
          expect /tmp/init-bubblewrap.exp

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEY_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASS }}
        run: |
          bubblewrap build --skipPwaValidation
          test -f app-release-signed.apk
          cp app-release-signed.apk NANDO-BROS-II.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NANDO-BROS-II-APK
          path: android/NANDO-BROS-II.apk
          if-no-files-found: error
          retention-days: 30
