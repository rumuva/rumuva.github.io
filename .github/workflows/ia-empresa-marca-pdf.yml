name: Brand IA Empresa learner PDF with Rubén's logo

on:
  push:
    paths:
      - '.github/workflows/ia-empresa-marca-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF editor
        run: python -m pip install --quiet pymupdf
      - name: Retrieve existing professional logo
        run: |
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/rumuva/ruben-munoz-docente/main/assets/logo.png' -o /tmp/logo-ruben.png
          test -s /tmp/logo-ruben.png
      - name: Change only the published PDF
        shell: bash
        run: |
          python - <<'PY'
          import fitz, re
          from pathlib import Path
          pdf=Path("curso-ia-empresa-50h/Guia_Didactica_Completa_Alumnado_50h.pdf")
          logo=Path("/tmp/logo-ruben.png")
          d=fitz.open(pdf); original_count=len(d)
          replacements=0
          for p in d:
              edits=[]
              for block in p.get_text("dict")["blocks"]:
                  if block.get("type")!=0: continue
                  for line in block["lines"]:
                      text="".join(sp["text"] for sp in line["spans"])
                      if not re.search("pendiente de confirmar|pendiente de confirmación",text,re.I):continue
                      if p.number>3 and "nombre del docente" not in p.get_text().lower():continue
                      new=re.sub(r"(?i)El nombre del docente queda pendiente de confirmación\\.?","Docente: Rubén Muñoz Valadés.",text)
                      new=re.sub(r"(?i)pendiente de confirmar\\.?","Rubén Muñoz Valadés",new)
                      new=re.sub(r"(?i)pendiente de confirmación\\.?","Rubén Muñoz Valadés",new)
                      new=new.split("Campo editable")[0].strip() if "Campo editable" in new else new
                      rect=fitz.Rect(line["bbox"])
                      p.add_redact_annot(fitz.Rect(rect.x0-1,rect.y0-1,rect.x1+2,rect.y1+1),fill=(1,1,1),cross_out=False)
                      edits.append((rect,new))
              if edits:
                  p.apply_redactions(images=0,graphics=0,text=0)
                  for rect,new in edits:
                      maxw=p.rect.width-rect.x0-48
                      size=min(10.8,maxw/max(20,len(new)*.55))
                      p.insert_text((rect.x0,rect.y1-2),new,fontsize=max(8,size),fontname="hebo",color=(.12,.32,.37))
                      replacements+=1
          p=d[0]; w=p.rect.width;h=p.rect.height
          panel=fitz.Rect(50,h-198,w-50,h-75)
          blocks=[fitz.Rect(b[:4]) for b in p.get_text("blocks") if isinstance(b[4],str) and b[4].strip()]
          cover_added=any(b.intersects(panel) for b in blocks)
          if cover_added:
              p=d.new_page(pno=0,width=w,height=h)
              p.draw_rect(fitz.Rect(0,0,w,8),color=(.06,.41,.46),fill=(.06,.41,.46))
              p.insert_text((65,76),"GUÍA DIDÁCTICA COMPLETA",fontsize=13,fontname="hebo",color=(.10,.43,.48))
              p.insert_textbox(fitz.Rect(65,135,w-55,240),"Alfabetización en Inteligencia Artificial y Productividad Empresarial",fontsize=28,fontname="hebo",color=(.09,.26,.32))
              p.insert_text((65,300),"50 HORAS · 8 UNIDADES",fontsize=13,fontname="hebo",color=(.28,.45,.51))
              p.draw_rect(fitz.Rect(65,370,w-65,570),color=(.74,.83,.82),fill=(.956,.979,.976))
              p.insert_image(fitz.Rect(95,395,195,526),filename=str(logo),keep_proportion=True)
              p.insert_text((230,447),"DOCENTE",fontsize=12,fontname="hebo",color=(.1,.46,.49))
              p.insert_text((230,479),"Rubén Muñoz Valadés",fontsize=19,fontname="hebo",color=(.08,.31,.36))
              p.insert_text((230,509),"Formación Profesional para el Empleo",fontsize=10,fontname="helv",color=(.3,.41,.44))
          else:
              p.draw_rect(panel,color=(.72,.84,.81),fill=(.955,.974,.972))
              p.insert_image(fitz.Rect(65,panel.y0+15,127,panel.y0+95),filename=str(logo),keep_proportion=True)
              p.insert_text((150,panel.y0+47),"DOCENTE",fontsize=11,fontname="hebo",color=(.1,.45,.49))
              p.insert_text((150,panel.y0+78),"Rubén Muñoz Valadés",fontsize=17,fontname="hebo",color=(.1,.3,.34))
          d.set_metadata({**d.metadata,"author":"Rubén Muñoz Valadés",
            "subject":"Alfabetización en Inteligencia Artificial y Productividad Empresarial · 50 horas"})
          tmp=pdf.with_suffix(".new.pdf");d.save(tmp,garbage=4,deflate=True);d.close()
          check=fitz.open(tmp)
          assert replacements>0, "No se encontró la referencia antigua al docente"
          assert len(check) in (original_count, original_count+1)
          assert check.metadata.get("author")=="Rubén Muñoz Valadés"
          assert "Rubén Muñoz Valadés" in check[0].get_text()
          print("PDF images:",len(check[0].get_images()),"image metadata:",len(check[0].get_image_info()))
          assert check[0].get_images() or check[0].get_image_info(), "No se encuentra el logotipo"
          # Only verify pending presenter labels on cover/intro pages; other
          # references to pending information are legitimate educational examples.
          remaining=[]
          for i,page in enumerate(check):
              if i>3:continue
              body=page.get_text().lower()
              if "pendiente de confirmar" in body or "pendiente de confirmación" in body: remaining.append(i+1)
          print("Unresolved cover instructor labels:",remaining)
          assert not remaining, "Quedan referencias al docente sin identificar en la portada"
          assert tmp.stat().st_size>50000
          check.close();tmp.replace(pdf)
          print("Branded PDF ready:",pdf, "replacement lines:",replacements,"cover added:",cover_added)
          PY
      - name: Commit only the PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curso-ia-empresa-50h/Guia_Didactica_Completa_Alumnado_50h.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Personalize IA Empresa learner PDF with Rubén Muñoz Valadés and logo"
            git push
          fi
